server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nginx работает за TLS reverse proxy на 443. Для directory redirect
  # возвращаем относительный Location, чтобы не раскрыть внутренний :8080.
  absolute_redirect off;

  # Quartz emits /page.html and links to /page.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;

  # Content-hashed assets can be cached indefinitely; HTML stays fresh.
  location ~* "-[0-9a-f]{8}\.(css|js)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
